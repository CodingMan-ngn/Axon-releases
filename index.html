<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON || PROJECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: #050505;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 30px 30px;
            overflow: hidden;
        }
        
        /* Glow effect behind the title */
        .glow {
            position: absolute;
            width: 400px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(60px);
            z-index: -1;
            top: 30%;
        }

        h1 { font-size: 72px; font-weight: 800; letter-spacing: -3px; margin-bottom: 40px; text-shadow: 0 0 40px rgba(255,255,255,0.1); z-index: 1; }
        
        .btn-container { display: flex; gap: 20px; margin-bottom: 40px; z-index: 1; }
        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.08); color: white; transform: translateY(-2px); border-color: rgba(255,255,255,0.3); }

        .socials { display: flex; gap: 15px; z-index: 1; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 10px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .icon-btn:hover { color: white; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
        
        .footer { position: absolute; bottom: 20px; color: #444; font-size: 12px; display: flex; gap: 20px; z-index: 1; }
        .footer span { cursor: pointer; transition: 0.2s; }
        .footer span:hover { color: #888; }

        /* Modal Styles */
        #video-modal {
            position: fixed; inset: 0; background: rgba(5,5,5,0.8); backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s;
        }
        #video-modal.show { display: flex; opacity: 1; }
        .modal-content {
            background: #0d0d0d; border: 1px solid #222; padding: 20px; border-radius: 20px;
            width: 90%; max-width: 900px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #video-modal.show .modal-content { transform: translateY(0); }
        
        .close-btn {
            position: absolute; top: -40px; right: 0; color: #666; font-size: 28px; cursor: pointer; transition: 0.2s;
        }
        .close-btn:hover { color: white; }

        video {
            width: 100%; border-radius: 12px; outline: none; background: #000;
        }
    </style>
</head>

    <!-- VIDEO POPUP MODAL -->
    <div id="video-modal" onclick="closeVideo(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="close-btn" onclick="closeVideo(event)">✕</div>
            <!-- REPLACE THE SRC WITH YOUR GITHUB TUTORIAL LINK -->
            <video controls autoplay>
                <source src="https://github.com/CodingMan-ngn/Axon-releases/raw/main/tutorial.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script>
        function openVideo() {
            document.getElementById('video-modal').classList.add('show');
            // Ensure video plays from start when opened
            const vid = document.querySelector('#video-modal video');
            vid.currentTime = 0;
        }

        function closeVideo(event) {
            if (event.target.id === 'video-modal' || event.target.classList.contains('close-btn')) {
                document.getElementById('video-modal').classList.remove('show');
                const vid = document.querySelector('#video-modal video');
                vid.pause();
            }
        }
    </script>
</body>
</html>
