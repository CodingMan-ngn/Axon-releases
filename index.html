<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axon | Premium Injector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: #050505;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 30px 30px;
        }
        h1 { font-size: 72px; font-weight: 800; letter-spacing: -3px; margin-bottom: 10px; text-shadow: 0 0 40px rgba(255,255,255,0.1); }
        p.subtitle { color: #888; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 50px; }
        
        .btn-container { display: flex; gap: 20px; }
        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.08); color: white; transform: translateY(-2px); border-color: rgba(255,255,255,0.3); }
        .btn.primary { background: white; color: black; border: none; }
        .btn.primary:hover { background: #e0e0e0; box-shadow: 0 10px 30px rgba(255,255,255,0.2); }

        /* Download Modal */
        #download-modal {
            position: fixed; inset: 0; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s;
        }
        #download-modal.show { display: flex; opacity: 1; }
        .modal-content {
            background: #0d0d0d; border: 1px solid #222; padding: 40px; border-radius: 24px;
            text-align: center; max-width: 400px; width: 100%;
        }
        .modal-content h2 { margin-bottom: 20px; font-size: 24px; }
        .modal-content .btn { width: 100%; justify-content: center; margin-bottom: 12px; }
        .modal-content .btn:last-child { margin-bottom: 0; }

        .socials { margin-top: 60px; display: flex; gap: 15px; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 10px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .icon-btn:hover { color: white; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
        
        .footer { position: absolute; bottom: 20px; color: #444; font-size: 12px; display: flex; gap: 20px; }
        .footer span { cursor: pointer; transition: 0.2s; }
        .footer span:hover { color: #888; }
    </style>
</head>
<body>
    <h1>Axon</h1>
    <p class="subtitle">Premium Injector</p>

    <div class="btn-container">
        <a href="https://axonware.pages.dev" class="btn">Get a key 🔑</a>
        <button onclick="showDownload()" class="btn primary">Download ⬇</button>
    </div>

    <div class="socials">
        <a href="https://discord.gg/afKpycby6s" class="icon-btn">Discord</a>
        <a href="#" class="icon-btn">YouTube</a>
    </div>

    <div class="footer">
        <span>Terms</span><span>Privacy</span><span>EULA</span><span>Security</span>
    </div>

    <!-- Download Modal -->
    <div id="download-modal" onclick="hideDownload(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>Download Axon</h2>
            <p style="color: #666; font-size: 13px; margin-bottom: 20px;">
                You must complete 2 checkpoints to unlock the download.
            </p>
            <!-- THIS IS WHERE THE 2 AD GATEWAYS GO -->
            <a href="YOUR_BOOSTYLINK_MULTI_STEP_LINK" class="btn primary">Unlock Download</a>
        </div>
    </div>

    <script>
        function showDownload() {
            document.getElementById('download-modal').classList.add('show');
        }
        function hideDownload(e) {
            if (e.target.id === 'download-modal') {
                document.getElementById('download-modal').classList.remove('show');
            }
        }
    </script>
</body>
</html>
