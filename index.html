<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CORE RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #050505;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- ANIMATED BACKGROUND GLOW --- */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 60%);
            filter: blur(60px);
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* --- TYPOGRAPHY --- */
        h1 { 
            font-size: 72px; 
            font-weight: 800; 
            letter-spacing: -3px; 
            margin-bottom: 40px; 
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 1;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* --- BUTTONS --- */
        .btn-container { display: flex; gap: 20px; margin-bottom: 40px; z-index: 1; }
        
        .btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ccc;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        /* Button Hover Flare */
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        
        .btn:hover::before { left: 100%; }
        
        .btn:hover { 
            background: rgba(255, 255, 255, 0.06); 
            color: white; 
            transform: translateY(-3px); 
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .btn:active { transform: translateY(-1px); }

        /* --- SOCIAL ICONS --- */
        .socials { display: flex; gap: 12px; z-index: 1; }
        
        .icon-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            color: #555;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .icon-btn:hover { 
            color: white; 
            border-color: rgba(255, 255, 255, 0.25); 
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .icon-btn svg { transition: transform 0.3s ease; }
        .icon-btn:hover svg { transform: scale(1.1); }

        /* --- FOOTER --- */
        .footer { position: absolute; bottom: 30px; color: #333; font-size: 12px; display: flex; gap: 25px; z-index: 1; font-weight: 500; }
        .footer span { cursor: pointer; transition: 0.2s; }
        .footer span:hover { color: #888; }

        /* --- MODAL (VIDEO POPUP) --- */
        #video-modal {
            position: fixed; inset: 0; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(15px);
            display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s;
        }
        #video-modal.show { display: flex; opacity: 1; }
        
        .modal-content {
            background: #0a0a0a; border: 1px solid #1a1a1a; padding: 15px; border-radius: 20px;
            width: 90%; max-width: 1000px; position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            transform: translateY(30px) scale(0.95); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #video-modal.show .modal-content { transform: translateY(0) scale(1); }
        
        .close-btn {
            position: absolute; top: -45px; right: 0; color: #666; font-size: 24px; cursor: pointer; transition: 0.2s;
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }
        .close-btn:hover { color: white; background: rgba(255,255,255,0.15); transform: rotate(90deg); }

        .video-container {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px;
            background: #000;
        }
        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }
    </style>
</head>

    <script>
        // --- YOUTUBE LOGIC ---
        // Your specific Video ID
        const youtubeVideoId = "mmbz6jSvprk"; 
        const embedUrl = `https://www.youtube.com/embed/${youtubeVideoId}?autoplay=1`;

        function openVideo() {
            document.getElementById('video-modal').classList.add('show');
            document.getElementById('yt-player').src = embedUrl;
        }

        function closeVideo(event) {
            if (event.target.id === 'video-modal' || event.target.classList.contains('close-btn')) {
                document.getElementById('video-modal').classList.remove('show');
                document.getElementById('yt-player').src = "";
            }
        }

        // --- ANTI-INSPECT & CODE STEALING PROTECTION ---
        
        // 1. Disable Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U (View Source)
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false; // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
        };

        // 3. Disable dragging images
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });
    </script>
