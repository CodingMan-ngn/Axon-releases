<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON || PROJECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CORE RESET --- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
        }
        
        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            padding: 40px 20px;
        }

        /* --- ANIMATED BACKGROUND ORB --- */
        .orb {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.12) 0%, transparent 60%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: floatOrb 12s infinite alternate ease-in-out;
        }

        @keyframes floatOrb {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0.7; }
            100% { transform: translate(-50%, -55%) scale(1.1) rotate(10deg); opacity: 1; }
        }

        /* --- TITLE --- */
        h1 { 
            font-size: 52px; 
            font-weight: 800; 
            letter-spacing: -2px; 
            margin-bottom: 30px; 
            background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            animation: floatText 5s infinite alternate ease-in-out;
            text-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
        }

        @keyframes floatText {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        
        /* --- ACTION BAR --- */
        .action-bar { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 30px; 
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 2;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cccccc;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .btn:hover::before { left: 100%; }

        .btn:hover { 
            background: rgba(255, 255, 255, 0.15); 
            color: #ffffff; 
            transform: translateY(-2px); 
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* --- VIDEO SECTION --- */
        .video-wrapper {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            background: #000000;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 30px;
            animation: scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .video-wrapper:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 1), 0 0 0 1px rgba(100, 150, 255, 0.3), 0 0 40px rgba(100, 150, 255, 0.1);
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* --- SOCIAL ICONS --- */
        .socials { 
            display: flex; 
            gap: 12px; 
            z-index: 1; 
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .icon-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            color: #666666;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            text-decoration: none;
        }

        .icon-btn:hover { 
            color: #ffffff; 
            border-color: rgba(255, 255, 255, 0.25); 
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .icon-btn svg { 
            transition: transform 0.3s ease; 
            width: 20px; 
            height: 20px; 
        }
        
        .icon-btn:hover svg { 
            transform: scale(1.15); 
        }

        /* --- FOOTER --- */
        .footer { 
            position: fixed; 
            bottom: 20px; 
            color: #333333; 
            font-size: 12px; 
            display: flex; 
            gap: 25px; 
            z-index: 1; 
            font-weight: 500; 
        }
        
        .footer span { 
            cursor: pointer; 
            transition: 0.2s; 
        }
        
        .footer span:hover { 
            color: #ffffff; 
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* --- LEGAL MODAL --- */
        #legal-modal {
            position: fixed; inset: 0; background: rgba(5,5,5,0.85); backdrop-filter: blur(15px);
            display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s;
        }
        #legal-modal.show { display: flex; opacity: 1; }
        .legal-content {
            background: #0a0a0a; border: 1px solid #1a1a1a; padding: 40px; border-radius: 20px;
            width: 90%; max-width: 600px; position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            transform: translateY(30px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 80vh; overflow-y: auto;
        }
        #legal-modal.show .legal-content { transform: translateY(0); }
        .legal-content h2 { font-size: 24px; margin-bottom: 20px; color: #fff; }
        .legal-content p { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 15px; }
        .legal-close {
            position: absolute; top: 20px; right: 20px; color: #666; font-size: 20px; cursor: pointer;
            transition: 0.2s; background: rgba(255,255,255,0.05); width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
        .legal-close:hover { color: white; background: rgba(255,255,255,0.15); transform: rotate(90deg); }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            h1 { font-size: 36px; }
            .action-bar { padding: 8px; gap: 8px; }
            .btn { padding: 12px 18px; font-size: 13px; }
        }
    </style>
</head>

    <script>

        // On hover, play and unmute. On leave, pause and mute.
        container.addEventListener('mouseenter', () => {
            sendYTCommand('unMute');
            sendYTCommand('playVideo');

        container.addEventListener('mouseleave', () => {

        });

                <p>If you suspect any malicious activity, please contact us immediately on Discord. Always download Axon from our official gateway. Fake versions exist.</p>
            `
        };

        function openLegal(title) {
            document.getElementById('legal-title').innerText = title;
            document.getElementById('legal-body').innerHTML = legalTexts[title] || '';
            document.getElementById('legal-modal').classList.add('show');
        }

        function closeLegal(event) {
            if (event.target.id === 'legal-modal' || event.target.classList.contains('legal-close')) {
                document.getElementById('legal-modal').classList.remove('show');
            }
        }

        // --- ANTI-INSPECT ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        };
        document.addEventListener('dragstart', function(e) { e.preventDefault(); });
    </script>
